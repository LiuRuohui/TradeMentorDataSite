<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradeMentor - 用户注册</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            padding: 40px 32px 32px 32px;
        }
        .section-title {
            font-size: 28px;
            font-weight: 600;
            color: #333;
            margin-bottom: 30px;
            text-align: center;
        }
        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        .error-message {
            color: #dc3545;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }
        .success-message {
            color: #28a745;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }
        .user-type-info {
            background: #e3f2fd;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #1976d2;
        }
        .user-type-info h4 {
            margin-bottom: 10px;
            color: #1565c0;
        }
        .user-type-info ul {
            list-style: none;
            padding-left: 0;
        }
        .user-type-info li {
            margin-bottom: 5px;
            padding-left: 20px;
            position: relative;
        }
        .user-type-info li:before {
            content: "•";
            position: absolute;
            left: 0;
            color: #1976d2;
        }
        .bottom-link {
            margin-top: 24px;
            text-align: center;
            font-size: 15px;
        }
        .bottom-link a {
            color: #667eea;
            text-decoration: underline;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="section-title">注册</h2>
        <div class="user-type-info">
            <h4>选择您的身份类型：</h4>
            <ul>
                <li><strong>交易专家</strong> - 专业的技术分析能力</li>
                <li><strong>股票新手</strong> - 刚开始学习投资</li>
                <li><strong>资深投资者</strong> - 有丰富投资经验</li>
                <li><strong>市场分析师</strong> - 专业市场分析</li>
                <li><strong>风险管理师</strong> - 专注于风险控制</li>
            </ul>
        </div>
        <form id="registerForm">
            <div class="form-group">
                <label for="registerUsername">用户名</label>
                <input type="text" id="registerUsername" name="username" required>
            </div>
            <div class="form-group">
                <label for="registerEmail">邮箱（可选）</label>
                <input type="email" id="registerEmail" name="email">
            </div>
            <div class="form-group">
                <label for="registerPassword">密码</label>
                <input type="password" id="registerPassword" name="password" required>
            </div>
            <div class="form-group">
                <label for="userType">身份类型</label>
                <select id="userType" name="user_type" required>
                    <option value="">请选择身份类型</option>
                    <option value="Trading Expert">交易专家</option>
                    <option value="Stock Newbie">股票新手</option>
                    <option value="Senior Investor">资深投资者</option>
                    <option value="Market Analyst">市场分析师</option>
                    <option value="Risk Manager">风险管理师</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary">注册</button>
            <div class="error-message" id="registerError"></div>
            <div class="success-message" id="registerSuccess"></div>
        </form>
        <div class="bottom-link">
            已有账号？<a href="/login">去登录</a>
        </div>
        <div class="bottom-link">
            <a href="/">返回主页</a>
        </div>
    </div>
    <script>
        const API_BASE = window.location.origin;
        function showError(elementId, message) {
            const element = document.getElementById(elementId);
            element.textContent = message;
            element.style.display = 'block';
            setTimeout(() => { element.style.display = 'none'; }, 5000);
        }
        function showSuccess(elementId, message) {
            const element = document.getElementById(elementId);
            element.textContent = message;
            element.style.display = 'block';
            setTimeout(() => { element.style.display = 'none'; }, 3000);
        }
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const registerData = {
                username: formData.get('username'),
                email: formData.get('email') || null,
                password: formData.get('password'),
                user_type: formData.get('user_type')
            };
            try {
                const response = await fetch(`${API_BASE}/api/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(registerData)
                });
                const result = await response.json();
                if (response.ok) {
                    showSuccess('registerSuccess', '注册成功！请登录');
                    setTimeout(() => { window.location.href = '/login'; }, 1200);
                } else {
                    showError('registerError', result.detail || '注册失败');
                }
            } catch (error) {
                showError('registerError', '网络错误，请重试');
            }
        });
        // 检查是否已登录
        function checkLoginStatus() {
            const user = localStorage.getItem('user');
            const token = localStorage.getItem('token');
            if (user && token) {
                fetch(`${API_BASE}/api/auth/me`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                }).then(response => {
                    if (response.ok) {
                        window.location.href = '/';
                    } else {
                        localStorage.removeItem('user');
                        localStorage.removeItem('token');
                    }
                }).catch(() => {
                    localStorage.removeItem('user');
                    localStorage.removeItem('token');
                });
            }
        }
        checkLoginStatus();
    </script>
</body>
</html>
